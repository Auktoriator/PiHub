name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests 2>&1 | tee test.log
      - name: Show what failed
        if: failure()
        shell: bash
        run: |
          # Puts the failure report on the run's summary page as an annotation.
          report=$(sed -n '/^=====/,$p' test.log | head -c 8000)
          report=${report//'%'/'%25'}
          report=${report//$'\n'/'%0A'}
          echo "::error title=Failing tests::${report:-no failure report in test.log}"
